# Run with: spring.profiles.active=dev (or -Dspring.profiles.active=dev)
# Uses H2 in-memory DB so you can run without PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:repairshop;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
