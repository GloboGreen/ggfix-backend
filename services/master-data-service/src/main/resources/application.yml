spring:
  application:
    name: master-data-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repairshop}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8091}
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-repair-shop-saas-jwt-signing}
  cloudinary:
    # Defaults below are the dev/team Cloudinary account so /media/upload
    # works out-of-the-box. Override via env vars in non-local environments.
    # If any of cloud-name / api-key / api-secret is blank, MediaController
    # falls back to inline base64 data URIs.
    # WARNING: rotate the api-secret in the Cloudinary dashboard if it leaks.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dg6c0g4gi}
    api-key: ${CLOUDINARY_API_KEY:694635395288588}
    api-secret: ${CLOUDINARY_API_SECRET:geEEuXbhDF5Wy0T8RuOTM8IpXh8}
    folder: ${CLOUDINARY_FOLDER:ggifx}
